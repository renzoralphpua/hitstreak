# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          TURSO_DATABASE_URL: file:.tmp-ci.db
          BETTER_AUTH_SECRET: ci-build-only-not-used-at-runtime

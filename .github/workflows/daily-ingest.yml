# .github/workflows/daily-ingest.yml
name: Daily price ingest

on:
  schedule:
    - cron: "0 21 * * *" # ~1h after tcgcsv's 20:00 UTC refresh
  workflow_dispatch:
    inputs:
      date:
        description: "Ingest date to record (YYYY-MM-DD). Leave empty for today (UTC). Use this to re-run a failed night under its own date."
        required: false
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx ingest/daily.ts
        env:
          INGEST_DATE: ${{ inputs.date }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
